name: Release

# Publishes a tagged release to npm using trusted publishing (OIDC).
# No NPM_TOKEN is stored: GitHub proves this repository's identity and npm
# issues a short-lived credential for the publish.
#
# Release flow:  bump "version" in package.json, merge, then
#                git tag v0.2.1 && git push origin v0.2.1
# The tag must match package.json; the job refuses otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gate publishing behind an environment so a reviewer can be required later.
    environment: npm
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v5

      # No registry-url here on purpose: with it, setup-node writes an empty
      # _authToken into .npmrc when NPM_TOKEN is unset, and npm then treats auth
      # as already configured and skips the OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # npm trusted publishing needs npm >= 11.5.1; setup-node ships older.
      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version

      - name: Resolve version and check the tag matches package.json
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::Tag v$TAG does not match package.json version $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing @signwell/node-sdk $VERSION"

      - name: Install
        run: npm ci

      # lint, build, test, tsd, both smoke tests, pack dry-run and audit
      - name: Validate
        run: npm run validate

      - name: Publish to npm (skipped if this version is already published)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@signwell/node-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@signwell/node-sdk@$VERSION is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Wait for npm to serve the new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/@signwell%2fnode-sdk" | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null; then
              echo "npm serves $VERSION"; exit 0
            fi
            sleep 10
          done
          echo "::error::npm never served @signwell/node-sdk@$VERSION"; exit 1

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "v$VERSION")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
